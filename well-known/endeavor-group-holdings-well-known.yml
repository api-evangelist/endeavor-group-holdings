method: probed
source: live probes of /.well-known/ on every host this record knows
summary: >-
  Nothing is served. Six hosts were probed across the WME Group estate — the corporate site
  (wmegrp.com + www), the legacy Endeavor domain (endeavorco.com, which 301s to wmegrp.com), and
  the three operating-brand sites (wmeagency.com, imglicensing.com, pantheonmedia.com). Every
  RFC-defined discovery path returned 404 on every host: no security.txt, no api-catalog, no OIDC
  discovery, no RFC 8414 / RFC 9728 OAuth metadata, no ai-plugin.json, no A2A agent card at either
  the current or the legacy path. This is consistent with the rest of the profile — Endeavor Group
  Holdings (trading publicly as WME Group) operates no developer program, so there is no API host
  for any of these documents to describe.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer emitted. Every probed path 404d; this file records
  a measured absence, not a served surface. The one agent-facing document found anywhere in the
  estate is an llms.txt on pantheonmedia.com, which is indexed under llms/ and pointed at with
  type LLMsTxt — it is not a /.well-known/ document and does not earn a WellKnown pointer.
false_positive_watch: >-
  pantheonmediagroup.com (note the trailing "group") is NOT a WME Group host. It is a GoDaddy
  aftermarket parking page that answers HTTP 200 with a /lander redirect shell for EVERY path,
  including /.well-known/agent-card.json, /openapi.json and /.well-known/api-catalog, and it serves
  a GoDaddy-authored llms.txt advertising the domain for sale. WME Group's own homepage links to
  https://www.pantheonmedia.com/ — that is the real Pantheon Media Group site. Any future round that
  reads a 200 from pantheonmediagroup.com as a published document is wrong; the host is excluded
  from hosts[] below for exactly that reason.
control_probe:
  note: >-
    Each host was also asked for a path that cannot exist, to prove its 404s are real and not a
    catch-all. imglicensing.com and pantheonmedia.com both returned 404 on the control path, so
    their 404s above are genuine misses rather than a soft-200 wall.
  probes:
    - url: https://imglicensing.com/nonexistent-probe-9z
      status: 404
    - url: https://pantheonmedia.com/nonexistent-9z
      status: 404
    - url: https://pantheonmediagroup.com/this-path-does-not-exist-12345
      status: 200
      note: parked-domain catch-all — this is why that host is excluded
